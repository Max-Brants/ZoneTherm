<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32">
  <!-- ZoneTherm mark. A Z drawn as one stroke: warm (ember) at the supply end,
       cool (glacier) at the return - the two seasons the plant runs in.
       Tile: ink 1C1B19, corner radius 25% of the side. -->
  <defs>
    <linearGradient id="flow" x1="0" y1="9.5" x2="0" y2="22.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0673D"/>
      <stop offset="1" stop-color="#4FA8E3"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#1C1B19"/>
  <path d="M10 9.5h12l-12 13h12" fill="none" stroke="url(#flow)" stroke-width="4.25" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
