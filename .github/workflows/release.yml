name: Release

# Publishes the two assets UpdateService downloads from
# https://github.com/<owner>/<repo>/releases/download/<tag>/:
#
#   firmware.bin  - the app image, flashed into the inactive OTA slot
#   littlefs.bin  - the web UI filesystem image
#
# Both names are hard-coded in Code/src/services/UpdateService.cpp; renaming
# an asset here silently breaks updates on every deployed device.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # UpdateService strips a leading v when comparing, but FW_VERSION is
          # stored without it so the /api/system payload stays clean.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Code/webui/package-lock.json

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('Code/platformio.ini', 'Code/src/idf_component.yml') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Stamp firmware version
        working-directory: Code
        run: |
          set -euo pipefail
          python - "${{ steps.ver.outputs.version }}" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          path = pathlib.Path("src/app/Version.h")
          text = path.read_text()
          patched, count = re.subn(
              r'^#define FW_VERSION ".*"$',
              f'#define FW_VERSION "{version}"',
              text,
              flags=re.M,
          )
          if count != 1:
              sys.exit(f"expected exactly one FW_VERSION define, found {count}")
          path.write_text(patched)
          print(f"FW_VERSION = {version}")
          PY

      - name: Build firmware
        working-directory: Code
        run: pio run -e esp32-s3-devkitc-1

      - name: Build filesystem image
        working-directory: Code
        run: pio run -e esp32-s3-devkitc-1 -t buildfs

      - name: Stage release assets
        working-directory: Code
        run: |
          set -euo pipefail
          BUILD=.pio/build/esp32-s3-devkitc-1
          mkdir -p dist
          cp "$BUILD/firmware.bin" dist/firmware.bin

          # mklittlefs pads the image out to the full 10 MB partition, almost
          # all of it erased (0xFF) blocks. The device erases the partition
          # before writing, so a trimmed prefix restores byte-for-byte the same
          # filesystem - and turns a 10 MB download into a couple hundred KB.
          python - "$BUILD/littlefs.bin" dist/littlefs.bin <<'PY'
          import pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_bytes()
          trimmed = raw.rstrip(b"\xff")
          # Keep the flash-page alignment the writer expects.
          if len(trimmed) % 4096:
              trimmed += b"\xff" * (4096 - len(trimmed) % 4096)
          pathlib.Path(sys.argv[2]).write_bytes(trimmed)
          print(f"littlefs.bin {len(raw)} -> {len(trimmed)} bytes")
          PY

          (cd dist && sha256sum firmware.bin littlefs.bin | tee SHA256SUMS.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            Code/dist/firmware.bin
            Code/dist/littlefs.bin
            Code/dist/SHA256SUMS.txt
