; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
extra_scripts = post:webui_build.py
; The host test suites under test/ target env:native only. Without this the
; device env tries to build them into the firmware, where <unity.h> and the
; six main() definitions do not exist / collide.
test_ignore = *

; Host unit tests for the domain layer: `pio test -e native`. Nothing here
; touches hardware, so this env has no board and no framework - it is plain
; g++ against libstdc++. CI runs it on every push; see .github/workflows/ci.yml.
[env:native]
platform = native
test_framework = unity
; Only src/domain/ compiles off-device - everything else under src/ pulls in
; ESP-IDF headers. src/util/ contributes no .cpp files, so StringUtils.h needs
; no entry here; its test includes the header directly.
build_src_filter = +<domain/>
; -Isrc so tests spell includes the way the firmware does ("domain/OtFrame.h")
; rather than drifting on relative paths.
build_flags = -std=gnu++17 -Isrc -Wall -Wextra

